services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fitzy
      POSTGRES_PASSWORD: fitzy
      POSTGRES_DB: fitzy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitzy"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
