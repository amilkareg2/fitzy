version: 2

updates:
  # Backend uses uv (pyproject.toml + uv.lock). Dependabot's "uv" ecosystem updates
  # the lock file too; the older "pip" ecosystem would bump pyproject.toml only and
  # leave uv.lock stale, which breaks `uv sync --locked`.
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Madrid
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Madrid
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Madrid
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - /infra/bootstrap
      - /infra/main
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Madrid
    groups:
      terraform-providers:
        patterns: ["*"]
